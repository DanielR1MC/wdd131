<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FitGuide - Your comprehensive workout and muscle training reference guide.">
    <meta name="author" content="Daniel Reyes">
    <title>FitGuide | Exercises</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/exercises.css">
    <script src="scripts/exercises.js" defer ></script>
</head>
<body>
    <header>
        <span id="nav-title"> FitGuide - Exercises Hub </span>
        <nav class="main-n">
            <a href="index.html" class="main-a">Home</a>
            <a href="exercises.html" class="main-a">Exercises</a>
            <a href="feedback.html" class="main-a">Feedback</a>
        </nav>
    </header>
    <main class="exercises-container">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search exercises (e.g. Bench, Squat)...">
        </div>
        <section class="filter-section">
            <h1>Exercise Library</h1>
            <p>Filter movements by targeted muscle group and equipment:</p>
            <div class="filter-group category-group">
                <button class="filter-btn active" data-category="all">All Exercises</button>
                <button class="filter-btn" data-category="upper">Upper Body</button>
                <button class="filter-btn" data-category="arms">Arms</button>
                <button class="filter-btn" data-category="lower">Lower Body</button>
            </div>
                <div class="filter-group equipment-group">
                <button class="filter-btn active" data-equipment="all">All Equipment</button>
                <button class="filter-btn" data-equipment="barbell">Barbell</button>
                <button class="filter-btn" data-equipment="dumbbell">Dumbbell</button>
                <button class="filter-btn" data-equipment="machine">Machine</button>
            </div>
        </section>

        <section id="exercise-grid" class="exercise-grid"></section>
    </main>
    <footer>
        <p> <span id="currentyear"></span> ©️ Daniel Reyes - Venezuela </p>  
        <p id="lastModified"></p>
    </footer>
</body>
</html>
