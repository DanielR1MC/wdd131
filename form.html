<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review</title>
  <link rel="stylesheet" href="form.css">
  <script src="form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>
  <main>
    <form method="get" action="review.html">
      <div class="form-group">
        <label for="product">Product Name</label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="form-group">
        <legend>Overall Rating</legend>
        <div class="rating-container">
          <input type="radio" id="star1" name="rating" value="1" required>
          <label for="star1">★1</label>
          <input type="radio" id="star2" name="rating" value="2">
          <label for="star2">★2</label>
          <input type="radio" id="star3" name="rating" value="3">
          <label for="star3">★3</label>
          <input type="radio" id="star4" name="rating" value="4">
          <label for="star4">★4</label>
          <input type="radio" id="star5" name="rating" value="5">
          <label for="star5">★5</label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="install-date">Date of Installation</label>
        <input type="date" id="install-date" name="install-date" required>
      </div>

      <fieldset class="form-group">
        <legend>Which features did you find useful in the product? (Check all that apply)</legend>
        <div class="checkbox-group">
          <label><input type="checkbox" id="feature-durability" name="features" value="durability"> Durability</label>
          <label><input type="checkbox" id="feature-ease" name="features" value="ease-of-use"> Ease of Use</label>
          <label><input type="checkbox" id="feature-performance" name="features" value="performance"> Performance</label>
          <label><input type="checkbox" id="feature-design" name="features" value="design"> Design</label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="written-review">Written Review (Optional)</label>
        <textarea id="written-review" name="written-review" rows="4"></textarea>
      </div>

      <div class="form-group">
        <label for="user-name">Your Name (Optional)</label>
        <input type="text" id="user-name" name="user-name">
      </div>

      <input type="submit" value="Post Review" class="submit-btn">
    </form>
  </main>
  <footer>
    <p>&copy; <span id="current-year"></span> Student Name | Course Assignment</p>
  </footer>
</body>
</html>
