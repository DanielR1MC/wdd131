<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daniel Reyes - WDD 131 - Dynamic Web Fundamentals - Country Page">
    <meta name="author" content="Daniel Reyes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer ></script>
    <title>WDD 131 - Dynamic Web Fundamentals - Daniel Reyes</title>
</head>
<body>
    <header>
        <h1>El Tigre</h1>
    </header>
    <main>
        <picture>
            <source srcset="images/labandera.webp" media="(max-width: 700px)">
            <img src="images/heroe-image.webp" alt="Estatue close to the Virgen del valle">
        </picture>
        <section class="section1">
            <h2>Data</h2>
            <p><strong>Area: </strong>703km</p>
            <p><strong>Population: </strong>214.000 </p>
            <p><strong>Languages: </strong>Spanish/Español/Castellano</p>
            <p><strong>Currency: </strong>Bolívar (VES)</p>
            <p><strong>Time Zone: </strong>UTC -4</p>
            <p><strong>Calling Code: </strong>+58 (0283)</p>
            <p><strong>Internet TLD: </strong>.ve</p>
        </section>
        <section class="section2">
            <h2>Weather</h2>
            <img src="images/weather.svg" alt="Partly cloudy weather icon" class="weather-img">
            <p><strong>Temperature: </strong><span id="temp">28</span> °C</p>
            <p><strong>Conditions: </strong>Partly Cloudy</p>
            <p><strong>Wind: </strong><span id="wind">10</span> km/h</p>
            <p><strong>Wind Chill: </strong><span id="chill">N/A</span></p>
        </section>
    </main>
    <footer>
        <p> <span id="currentyear"></span> ©️ Daniel Reyes - Venezuela </p>
        
        <p id="lastModified"></p>
    </footer>
